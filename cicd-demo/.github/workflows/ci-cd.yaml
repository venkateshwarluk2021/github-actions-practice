name: CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    
    
env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/cicd-demo
  
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint
        run: flake8 app.py test_app.py --max-line-length=100
      - name: Unit tests
        run: pytest -v
        
  build-and-push:
    needs: test 
    if: github.event_name == 'push' && github.ref="refs/heads/main"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest 
            ${{ env.IMAGE }};${{ github.sha }}
            
  deploy:
    needs: build-and-push 
    runs-on: self-hosted
    steps:
      - name: Pull new image
        run: docker pull ${{ env.IMAGE }}:${{ github.sha }}
      - name: Replace running container
        run: |
          docker rm -f cicd-demo || true 
          docker run -d --name cicd-demo --restart unless-stopped \
            -p 8080:5000 ${{ env.IMAGE }}:${{ github.sha }}
      - name: Health check 
        run: |
          for i in 1 2 3 4 5; do
            curl -fs http://localhost:8080/health && exit 0
            sleep 3
          done
          echo "Deploy failed health check"; exit 1